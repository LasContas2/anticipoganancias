<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Acceso privado — Las Contas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --azul-medio:#507EB2; --rosa:#F2A9BF; --rosa-claro:#F2D2DF; --gris-calido:#ECEBE5;
    --azul-oscuro:#094E86; --rosa-intenso:#FF5D8F; --blanco:#FFFFFF;
    --font:"Poppins", Calibri, "Segoe UI", Arial, sans-serif;
  }
  *{ box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    margin:0; font-family:var(--font); color:var(--azul-oscuro);
    background-color:var(--azul-oscuro);
    background-image:
      linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px),
      linear-gradient(135deg, var(--azul-oscuro) 0%, var(--azul-medio) 70%, #8FA6CB 100%);
    background-size:28px 28px, 28px 28px, 100% 100%;
    display:grid; place-items:center; padding:24px 16px; overflow-x:hidden;
  }
  .blob{ position:fixed; border-radius:50%; pointer-events:none; }
  .b1{ width:420px; height:420px; right:-160px; top:-180px; background:rgba(242,169,191,.28); }
  .b2{ width:260px; height:260px; left:-110px; bottom:-120px; background:rgba(242,210,223,.18); }
  .card{
    position:relative; z-index:1; width:100%; max-width:420px;
    background:var(--blanco); border-radius:28px; padding:34px 30px 28px;
    box-shadow:0 20px 60px rgba(4,32,58,.35); text-align:center;
  }
  .logo{ width:96px; height:96px; border-radius:50%; overflow:hidden; margin:0 auto 14px; display:grid; place-items:center; background:var(--blanco); }
  .logo img{ width:96px; height:96px; display:block; transform:scale(1.5); }
  .lock{ width:44px; height:44px; border-radius:14px; background:var(--rosa-claro); display:grid; place-items:center; margin:0 auto 12px; }
  .lock svg{ width:22px; height:22px; stroke:var(--azul-oscuro); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  h1{ margin:0; font-size:22px; font-weight:700; line-height:1.25; }
  p.lead{ margin:8px 0 22px; font-size:14px; font-style:italic; color:#3F6690; }
  form{ display:flex; flex-direction:column; gap:12px; text-align:left; }
  label{ font-size:12.5px; font-weight:600; color:#3F6690; }
  .pw{ position:relative; }
  input{
    width:100%; font-family:var(--font); font-size:15px; color:var(--azul-oscuro);
    padding:12px 46px 12px 14px; border-radius:14px; border:1.5px solid #DCD9CF; background:var(--blanco);
  }
  input:focus{ outline:none; border-color:var(--azul-medio); box-shadow:0 0 0 3px rgba(80,126,178,.2); }
  .toggle{ position:absolute; right:6px; top:50%; transform:translateY(-50%); border:0; background:transparent; padding:8px; cursor:pointer; border-radius:10px; }
  .toggle svg{ width:20px; height:20px; stroke:var(--azul-medio); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  button.go{
    font-family:var(--font); font-weight:600; font-size:15px; color:var(--blanco);
    background:var(--azul-oscuro); border:0; border-radius:999px; padding:13px 18px; cursor:pointer; margin-top:4px;
  }
  button.go:hover{ background:#0B5C9E; }
  button.go:disabled{ opacity:.7; cursor:wait; }
  .err{ min-height:20px; font-size:13px; color:var(--rosa-intenso); font-weight:600; text-align:center; }
  .foot{ margin-top:18px; font-size:12px; color:#6F8AA8; }
</style>
</head>

  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const $ = id => document.getElementById(id);

  async function decrypt(pw){
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name:"PBKDF2", salt:b64(DATA.salt), iterations:DATA.iter, hash:"SHA-256" },
      base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(DATA.iv) }, key, b64(DATA.ct));
    return new TextDecoder().decode(plain);
  }

  $("tg").addEventListener("click", () => {
    const i = $("pw"); i.type = i.type === "password" ? "text" : "password"; i.focus();
  });

  $("f").addEventListener("submit", async e => {
    e.preventDefault();
    const go = $("go"), err = $("err");
    err.textContent = ""; go.disabled = true; go.textContent = "Verificando…";
    try {
      if (!window.crypto || !crypto.subtle) throw new Error("nocrypto");
      const html = await decrypt($("pw").value);
      document.open(); document.write(html); document.close();
    } catch (x) {
      err.textContent = x && x.message === "nocrypto"
        ? "Tu navegador no permite abrir esta página. Probá con otro navegador."
        : "Contraseña incorrecta. Revisala e intentá de nuevo.";
      go.disabled = false; go.textContent = "Ingresar";
      $("pw").select();
    }
  });
